<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROTOTYPE — Quick Stack result UI</title>
  <!--
    PROTOTYPE — throwaway design study, not production runtime code.
    Question: which wide F6-style information hierarchy works best for a
    transient Quick Stack result with three/four-column item grids?
    Variants are switchable with ?variant=A, ?variant=B, and ?variant=C.
  -->
  <style>
    :root {
      --surface-window: rgba(28, 48, 54, .94);
      --surface-chrome: rgba(45, 72, 78, .96);
      --surface-content: rgba(31, 55, 61, .96);
      --surface-section: rgba(67, 102, 108, .64);
      --surface-control: rgba(72, 112, 118, .90);
      --surface-hover: rgba(92, 137, 143, .94);
      --surface-muted: rgba(18, 39, 44, .70);
      --outline: rgba(194, 220, 226, .20);
      --text-primary: rgb(240, 249, 251);
      --text-secondary: rgb(194, 216, 220);
      --text-muted: rgb(135, 166, 171);
      --text-on-accent: rgb(10, 25, 29);
      --primary: rgb(103, 198, 210);
      --warning: rgb(224, 160, 75);
      --danger: rgb(213, 111, 102);
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
    }

    * { box-sizing: border-box; }

    html, body {
      min-width: 100%;
      min-height: 100%;
      margin: 0;
      color: var(--text-primary);
      font-family: "Microsoft YaHei UI", "Noto Sans CJK SC", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(144, 202, 179, .38), transparent 30%),
        radial-gradient(circle at 78% 30%, rgba(105, 143, 201, .35), transparent 32%),
        linear-gradient(135deg, #544b43 0%, #263c40 42%, #58493f 100%);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: auto;
    }

    button { font: inherit; border: 0; }

    .prototype-label {
      position: fixed;
      top: 16px;
      right: 18px;
      z-index: 20;
      padding: 6px 10px;
      color: #1f241c;
      background: #d1b367;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .variant { display: none; width: min(1320px, calc(100vw - 48px)); }
    .variant.active { display: block; }

    .result-window {
      width: 100%;
      overflow: hidden;
      background: var(--surface-window);
      outline: 1px solid var(--outline);
      box-shadow: 0 18px 60px rgba(0, 0, 0, .35);
    }

    .result-header {
      min-height: 64px;
      display: grid;
      place-items: center;
      padding: var(--space-3) var(--space-4);
      background: var(--surface-chrome);
    }

    .result-title {
      margin: 0;
      font-size: 26px;
      line-height: 1.2;
      font-weight: 650;
      text-shadow: 1px 1px 0 rgba(0, 0, 0, .55);
    }

    .result-title.warning { color: var(--warning); }

    .result-subtitle {
      margin-top: var(--space-1);
      color: var(--text-secondary);
      font-size: 12px;
    }

    .result-content {
      max-height: calc(100vh - 176px);
      padding: var(--space-4);
      overflow-y: auto;
      background: var(--surface-content);
    }

    .result-footer {
      min-height: 56px;
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: 10px var(--space-4);
      color: var(--text-secondary);
      background: var(--surface-chrome);
    }

    .countdown { flex: 1; font-size: 14px; }

    .confirm {
      min-width: 120px;
      min-height: 36px;
      padding: 4px 16px;
      color: var(--text-on-accent);
      background: var(--primary);
      font-size: 14px;
      font-weight: 700;
    }

    .section + .section { margin-top: var(--space-4); }

    .section-heading {
      min-height: 36px;
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: 4px var(--space-3);
      background: var(--surface-section);
    }

    .section-title {
      flex: 1;
      color: var(--primary);
      font-size: 15px;
      font-weight: 650;
    }

    .section.warning .section-title { color: var(--warning); }

    .section-total {
      color: var(--text-secondary);
      font-size: 12px;
      white-space: nowrap;
    }

    .item-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--space-1);
      padding-top: var(--space-1);
    }

    .item-row {
      min-width: 0;
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: 4px var(--space-2);
      background: var(--surface-muted);
    }

    .item-icon {
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      display: grid;
      place-items: center;
      color: rgba(255, 255, 255, .92);
      background:
        radial-gradient(circle at 35% 28%, rgba(255,255,255,.7), transparent 18%),
        linear-gradient(145deg, var(--icon-a, #8cc4bf), var(--icon-b, #405a70));
      border: 1px solid rgba(230, 246, 249, .22);
      font-size: 12px;
      font-weight: 800;
    }

    .item-name {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      color: var(--text-primary);
      font-size: 14px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-count {
      flex: 0 0 auto;
      min-width: 48px;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 700;
      text-align: right;
      white-space: nowrap;
    }

    .overflow-note {
      padding: var(--space-2) var(--space-3) 0;
      color: var(--text-muted);
      font-size: 12px;
    }

    .warning-helper {
      padding: var(--space-2) var(--space-3) var(--space-1);
      color: var(--text-secondary);
      font-size: 12px;
    }

    .summary-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-1);
      margin-bottom: var(--space-4);
      background: var(--surface-muted);
    }

    .summary-cell {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: var(--space-2);
      min-height: 52px;
      padding: var(--space-2) var(--space-3);
      background: var(--surface-section);
    }

    .summary-name { color: var(--text-secondary); font-size: 13px; }
    .summary-value { color: var(--text-primary); font-size: 17px; font-weight: 700; }
    .summary-cell.warning .summary-name,
    .summary-cell.warning .summary-value { color: var(--warning); }

    .mixed-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--space-1);
    }

    .mixed-item {
      min-width: 0;
      min-height: 54px;
      padding: 6px var(--space-2);
      background: var(--surface-muted);
    }

    .mixed-item .item-row { min-height: 34px; padding: 0; background: transparent; }
    .mixed-state { color: var(--text-muted); font-size: 10px; }
    .mixed-state.stored { color: var(--primary); }
    .mixed-state.full { color: var(--warning); }

    .category-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-1);
      padding: var(--space-1);
      background: rgba(35, 61, 67, .88);
    }

    .category-tab {
      min-height: 40px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: var(--space-2);
      padding: 4px var(--space-3);
      color: var(--text-secondary);
      background: var(--surface-control);
    }

    .category-tab.active {
      color: var(--text-on-accent);
      background: var(--primary);
    }

    .tab-panel {
      min-height: 300px;
      padding-top: var(--space-3);
    }

    .tab-helper {
      margin: 0 0 var(--space-3);
      color: var(--text-secondary);
      font-size: 12px;
    }

    .switcher {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: 6px;
      transform: translateX(-50%);
      color: white;
      background: rgba(8, 18, 21, .96);
      box-shadow: 0 8px 28px rgba(0,0,0,.4);
    }

    .switcher button {
      min-width: 38px;
      min-height: 34px;
      color: white;
      background: var(--surface-control);
      cursor: pointer;
    }

    .switcher-label { min-width: 270px; text-align: center; font-size: 13px; }

    @media (max-width: 1180px) {
      .item-grid, .mixed-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 820px) {
      body { padding: 24px; }
      .variant { width: calc(100vw - 48px); }
      .item-grid, .mixed-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .summary-strip, .category-tabs { grid-template-columns: 1fr; }
      .switcher-label { min-width: 190px; }
    }
  </style>
</head>
<body>
  <div class="prototype-label">PROTOTYPE</div>

  <main>
    <section class="variant" data-variant="A" aria-label="方案 A：全宽分区">
      <div class="result-window">
        <header class="result-header">
          <h1 class="result-title warning">部分物品未能收纳</h1>
        </header>
        <div class="result-content">
          <section class="section warning">
            <div class="section-heading">
              <div class="section-title">未能收纳 · 存储空间已满</div>
              <div class="section-total">2 种 · 323 件仍在背包</div>
            </div>
            <div class="warning-helper">存储空间已满，这些物品仍留在背包中。</div>
            <div class="item-grid" data-items="full"></div>
          </section>
          <section class="section">
            <div class="section-heading">
              <div class="section-title">已收纳</div>
              <div class="section-total">10 种 · 10 件</div>
            </div>
            <div class="item-grid" data-items="stored"></div>
          </section>
          <section class="section">
            <div class="section-heading">
              <div class="section-title">已排除</div>
              <div class="section-total">14 种 · 5460 件</div>
            </div>
            <div class="item-grid" data-items="excluded"></div>
            <div class="overflow-note">另有 2 种物品未展开</div>
          </section>
        </div>
        <footer class="result-footer">
          <div class="countdown">将在 3 秒后自动关闭</div>
          <button class="confirm" type="button">确定</button>
        </footer>
      </div>
    </section>

    <section class="variant" data-variant="B" aria-label="方案 B：摘要优先混合网格">
      <div class="result-window">
        <header class="result-header">
          <h1 class="result-title">收纳完成</h1>
          <div class="result-subtitle">本次处理结果</div>
        </header>
        <div class="result-content">
          <div class="summary-strip">
            <div class="summary-cell"><span class="summary-name">已收纳</span><strong class="summary-value">10 种 · 10 件</strong></div>
            <div class="summary-cell warning"><span class="summary-name">未能收纳</span><strong class="summary-value">2 种 · 323 件</strong></div>
            <div class="summary-cell"><span class="summary-name">已排除</span><strong class="summary-value">14 种 · 5460 件</strong></div>
          </div>
          <div class="section-heading">
            <div class="section-title">物品明细</div>
            <div class="section-total">按处理结果标记</div>
          </div>
          <div class="mixed-grid" data-items="mixed"></div>
          <div class="overflow-note">仅显示前 16 种物品</div>
        </div>
        <footer class="result-footer">
          <div class="countdown">将在 3 秒后自动关闭</div>
          <button class="confirm" type="button">确定</button>
        </footer>
      </div>
    </section>

    <section class="variant" data-variant="C" aria-label="方案 C：分类切换">
      <div class="result-window">
        <header class="result-header">
          <h1 class="result-title">收纳完成</h1>
          <div class="result-subtitle">选择分类查看明细</div>
        </header>
        <div class="result-content">
          <nav class="category-tabs" aria-label="结果分类">
            <button class="category-tab active" type="button" data-tab="stored"><span>已收纳</span><strong>10 种 · 10 件</strong></button>
            <button class="category-tab" type="button" data-tab="full"><span>未能收纳</span><strong>2 种 · 323 件</strong></button>
            <button class="category-tab" type="button" data-tab="excluded"><span>已排除</span><strong>14 种 · 5460 件</strong></button>
          </nav>
          <div class="tab-panel">
            <p class="tab-helper">已成功存入基地中的对应普通存储箱。</p>
            <div class="item-grid" data-items="stored"></div>
          </div>
        </div>
        <footer class="result-footer">
          <div class="countdown">将在 3 秒后自动关闭</div>
          <button class="confirm" type="button">确定</button>
        </footer>
      </div>
    </section>
  </main>

  <div class="switcher" aria-label="原型方案切换">
    <button type="button" data-direction="-1" aria-label="上一个方案">‹</button>
    <div class="switcher-label"></div>
    <button type="button" data-direction="1" aria-label="下一个方案">›</button>
  </div>

  <script>
    const data = {
      stored: [
        ["桃", "蝙蝠蜜桃", 1, "#bb77d5", "#5b4779"],
        ["材", "耗材植入体", 1, "#9579d8", "#455987"],
        ["果", "升段频果☆1", 1, "#86c849", "#4f7043"],
        ["册", "采集学 I", 1, "#58bb79", "#3e6d59"],
        ["果", "成熟的升段频果", 1, "#e85f76", "#86505d"],
        ["图", "重型突击步枪设计图", 1, "#3c8ea5", "#344b6a"],
        ["药", "高级回复药", 1, "#d99559", "#7c4d46"],
        ["核", "古代文明核心", 1, "#69b9a8", "#385e6b"],
        ["书", "技术书·高阶", 1, "#aa78cf", "#4f5482"],
        ["果", "生命升段果实", 1, "#d85e91", "#73445e"]
      ],
      full: [
        ["矿", "帕鲁金属锭", 240, "#778f9a", "#3d515b"],
        ["油", "高品质帕鲁油", 83, "#d49a4f", "#6e5a3c"]
      ],
      excluded: [
        ["球", "烈阳帕鲁球", 540, "#d9c58b", "#665c47"],
        ["球", "远古帕鲁球", 16, "#63b9ce", "#315b6c"],
        ["弹", "突击步枪子弹", 2900, "#6e83ac", "#3c485b"],
        ["箭", "高级箭矢", 480, "#9b7954", "#554633"],
        ["药", "回复药", 36, "#73ad83", "#416451"],
        ["石", "帕鲁矿碎块", 720, "#74a4b8", "#3e5c6b"],
        ["肉", "烤野莓", 204, "#c5775e", "#754a42"],
        ["种", "小麦种子", 160, "#b1a957", "#5f623d"],
        ["布", "优质布料", 96, "#ad8fc1", "#65536d"],
        ["零", "古代文明部件", 84, "#a78469", "#5c4e45"],
        ["角", "结冰器官", 120, "#79b5d5", "#3d6075"],
        ["革", "皮革", 104, "#a16f56", "#5f493d"]
      ]
    };

    const names = {
      A: "A — 全宽纵向分区（推荐）",
      B: "B — 摘要优先混合网格",
      C: "C — 分类切换后查看"
    };

    function itemMarkup(item, state) {
      const [short, name, count, a, b] = item;
      const row = `
        <div class="item-row">
          <span class="item-icon" style="--icon-a:${a};--icon-b:${b}">${short}</span>
          <span class="item-name">${name}</span>
          <span class="item-count">×${count}</span>
        </div>`;
      if (!state) return row;
      const labels = { stored: "已收纳", full: "未能收纳", excluded: "已排除" };
      return `<div class="mixed-item">${row}<div class="mixed-state ${state}">${labels[state]}</div></div>`;
    }

    document.querySelectorAll("[data-items]").forEach(host => {
      const type = host.dataset.items;
      if (type === "mixed") {
        const mixed = [
          ...data.full.map(item => [item, "full"]),
          ...data.stored.map(item => [item, "stored"]),
          ...data.excluded.slice(0, 4).map(item => [item, "excluded"])
        ];
        host.innerHTML = mixed.map(([item, state]) => itemMarkup(item, state)).join("");
      } else {
        host.innerHTML = data[type].map(item => itemMarkup(item)).join("");
      }
    });

    const order = ["A", "B", "C"];
    const search = new URLSearchParams(location.search);
    let current = order.includes(search.get("variant")) ? search.get("variant") : "A";

    function renderVariant(next) {
      current = next;
      document.querySelectorAll(".variant").forEach(variant => {
        variant.classList.toggle("active", variant.dataset.variant === current);
      });
      document.querySelector(".switcher-label").textContent = names[current];
      const url = new URL(location.href);
      url.searchParams.set("variant", current);
      history.replaceState({}, "", url);
    }

    function cycle(direction) {
      const index = order.indexOf(current);
      renderVariant(order[(index + direction + order.length) % order.length]);
    }

    document.querySelectorAll(".switcher button").forEach(button => {
      button.addEventListener("click", () => cycle(Number(button.dataset.direction)));
    });

    document.addEventListener("keydown", event => {
      if (["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName)
          || document.activeElement?.isContentEditable) return;
      if (event.key === "ArrowLeft") cycle(-1);
      if (event.key === "ArrowRight") cycle(1);
    });

    document.querySelectorAll(".category-tab").forEach(button => {
      button.addEventListener("click", () => {
        const variant = button.closest(".variant");
        variant.querySelectorAll(".category-tab").forEach(tab => tab.classList.remove("active"));
        button.classList.add("active");
        const type = button.dataset.tab;
        variant.querySelector(".tab-helper").textContent = {
          stored: "已成功存入基地中的对应普通存储箱。",
          full: "由于兼容存储空间已满，下列物品仍留在背包中。",
          excluded: "下列物品来自 Tab → R 排除列表，本次未参与收纳。"
        }[type];
        variant.querySelector("[data-items]").innerHTML = data[type].map(item => itemMarkup(item)).join("");
      });
    });

    renderVariant(current);
  </script>
</body>
</html>
